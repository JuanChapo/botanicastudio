<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error en el pago — Botanica Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #FDFCFA;
            color: #1A1A1A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container { text-align: center; max-width: 480px; }
        .icon {
            width: 80px; height: 80px; border-radius: 50%;
            background: #FDE8E8; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 1.5rem; font-size: 2.2rem;
        }
        h1 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 400; margin-bottom: 0.8rem; color: #D4545E; }
        p { color: #7A7A7A; font-weight: 300; line-height: 1.7; margin-bottom: 2rem; }
        .buttons { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; }
        a {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.85rem 2rem; border-radius: 100px;
            text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: all 0.3s;
        }
        .btn-primary { background: #C4917B; color: white; }
        .btn-primary:hover { background: #A67460; }
        .btn-wa { background: #25D366; color: white; }
        .btn-wa:hover { background: #1FAD54; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#10007;</div>
        <h1>Hubo un problema con el pago</h1>
        <p>No te preocupes, no se realizó ningún cargo. Puedes intentarlo de nuevo o contactarnos por WhatsApp para ayudarte.</p>
        <div class="buttons">
            <a href="/" class="btn-primary">Intentar de nuevo</a>
            <a href="https://wa.me/525554097367?text=Hola%2C%20tuve%20un%20problema%20con%20mi%20pago" target="_blank" class="btn-wa">WhatsApp</a>
        </div>
    </div>
</body>
</html>
