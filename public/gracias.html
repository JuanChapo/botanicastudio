<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago exitoso — Botanica Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #FDFCFA;
            color: #1A1A1A;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            text-align: center;
            max-width: 480px;
        }
        .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #EDF2ED;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2.2rem;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 0.8rem;
            color: #6B8F71;
        }
        p {
            color: #7A7A7A;
            font-weight: 300;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }
        .order-id {
            background: #F8F5F1;
            border: 1px solid #EBEBEB;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            font-size: 0.85rem;
        }
        .order-id strong { color: #1A1A1A; }
        a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 2rem;
            border-radius: 100px;
            background: #C4917B;
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s;
        }
        a:hover { background: #A67460; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#10003;</div>
        <h1>Pago recibido</h1>
        <p>Gracias por tu compra. Estamos preparando tu arreglo con flores frescas. Te enviaremos un mensaje por WhatsApp cuando tu pedido esté en camino.</p>
        <div class="order-id">
            <strong>Tu pedido está confirmado</strong><br>
            Recibirás los detalles en tu correo electrónico.
        </div>
        <a href="/">Volver a la tienda</a>
    </div>
</body>
</html>
