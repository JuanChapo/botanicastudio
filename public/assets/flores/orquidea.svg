<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <defs>
    <radialGradient id="orquidea">
      <stop offset="0%" style="stop-color:#FFB6D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:1" />
    </radialGradient>
  </defs>
  <!-- Pétalos laterales superiores -->
  <ellipse cx="35" cy="25" rx="8" ry="18" fill="url(#orquidea)" transform="rotate(-40 35 25)"/>
  <ellipse cx="65" cy="25" rx="8" ry="18" fill="url(#orquidea)" transform="rotate(40 65 25)"/>
