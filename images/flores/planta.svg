<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <defs>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Maceta -->
  <path d="M 30 80 L 25 110 L 75 110 L 70 80 Z" fill="#A0826D" stroke="#8B7355" stroke-width="1"/>
  <ellipse cx="50" cy="80" rx="20" ry="6" fill="#B8956A"/>
  <ellipse cx="50" cy="80" rx="18" ry="4" fill="#D4A574" opacity="0.6"/>
  
  <!-- Tierra -->
  <ellipse cx="50" cy="82" rx="17" ry="5" fill="#8B7355"/>
  
  <!-- Hojas principales -->
  <g opacity="0.9">
    <!-- Hoja izquierda -->
    <ellipse cx="35" cy="50" rx="10" ry="25" fill="url(#leaf-grad)" transform="rotate(-35 35 50)" stroke="#1B5E20" stroke-width="0.5"/>
    <!-- Hoja central alta -->
    <ellipse cx="50" cy="30" rx="9" ry="28" fill="url(#leaf-grad)" stroke="#1B5E20" stroke-width="0.5"/>
    <!-- Hoja derecha -->
    <ellipse cx="65" cy="50" rx="10" ry="25" fill="url(#leaf-grad)" transform="rotate(35 65 50)" stroke="#1B5E20" stroke-width="0.5"/>
  </g>
  
  <!-- Hojas secundarias -->
  <g opacity="0.7">
    <ellipse cx="42" cy="65" rx="7" ry="15" fill="#66BB6A" transform="rotate(-50 42 65)" stroke="#2E7D32" stroke-width="0.5"/>
    <ellipse cx="58" cy="65" rx="7" ry="15" fill="#66BB6A" transform="rotate(50 58 65)" stroke="#2E7D32" stroke-width="0.5"/>
  </g>
  
  <!-- Detalles de nervios en hojas principales -->
  <g stroke="#1B5E20" stroke-width="0.5" opacity="0.5" fill="none">
    <path d="M 50 30 Q 48 45 47 70" />
    <path d="M 50 30 Q 52 45 53 70" />
    <path d="M 35 50 Q 36 60 37 75" />
    <path d="M 65 50 Q 64 60 63 75" />
  </g>
</svg>