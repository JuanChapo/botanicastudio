<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Panel — Botanica Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#FFFCFC; --text:#2B2226; --text-light:#7D6E73;
            --accent:#A35A66; --accent-dark:#8A4A55; --accent-light:#F8EDEF;
            --green:#5E8168; --green-bg:#EDF3EE; --amber:#9A7B2E; --amber-bg:#FBF3E0;
            --border:#F0E7E9; --white:#fff; --cream:#FBF4F3;
            --serif:'Playfair Display',Georgia,serif; --sans:'Inter',-apple-system,sans-serif;
            --sombra:0 4px 20px rgba(90,55,62,.07);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;
             -webkit-font-smoothing:antialiased}

        .barra{background:var(--cream);border-bottom:1px solid var(--border);
               position:sticky;top:0;z-index:20}
        .barra-in{max-width:1000px;margin:0 auto;padding:.95rem 1.1rem;
                  display:flex;align-items:center;justify-content:space-between;gap:1rem}
        .marca{display:flex;align-items:center;gap:.5rem;font-family:var(--serif);font-size:1.1rem}
        .marca svg{width:24px;height:24px;color:var(--accent)}
        .salir{background:none;border:none;color:var(--text-light);font-size:.8rem;
               cursor:pointer;font-family:var(--sans);text-decoration:underline}

        main{max-width:1000px;margin:0 auto;padding:1.4rem 1.1rem 4rem}

        /* ── Acceso ── */
        .acceso{max-width:340px;margin:14vh auto;text-align:center}
        .acceso svg{width:44px;height:44px;color:var(--accent);margin-bottom:1rem}
        .acceso h1{font-family:var(--serif);font-size:1.6rem;font-weight:500;margin-bottom:.3rem}
        .acceso p{font-size:.85rem;color:var(--text-light);margin-bottom:1.6rem}
        input[type=password]{width:100%;font-family:var(--sans);font-size:1rem;
            padding:.8rem .9rem;border:1px solid var(--border);border-radius:12px;
            background:var(--white);text-align:center;letter-spacing:.1em}
        input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
        .btn{width:100%;margin-top:.7rem;padding:.8rem;border:none;border-radius:100px;
             background:var(--accent);color:#fff;font-family:var(--sans);font-size:.9rem;
             font-weight:500;cursor:pointer;transition:background .2s}
        .btn:hover{background:var(--accent-dark)}
        .btn:disabled{opacity:.55;cursor:default}
        .error{margin-top:.8rem;font-size:.83rem;color:#B3454F}

        /* ── Periodo ── */
        .periodos{display:flex;gap:.4rem;margin-bottom:1.3rem;flex-wrap:wrap}
        .per{padding:.42rem 1rem;border-radius:100px;border:1px solid var(--border);
             background:var(--white);font-family:var(--sans);font-size:.82rem;
             color:var(--text-light);cursor:pointer}
        .per.on{background:var(--accent);border-color:var(--accent);color:#fff}

        /* ── Resumen ── */
        .tarjetas{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
                  gap:.75rem;margin-bottom:1.6rem}
        .tj{background:var(--white);border:1px solid var(--border);border-radius:16px;
            padding:1rem 1.05rem;box-shadow:var(--sombra)}
        .tj .et{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;
                color:var(--accent);font-weight:500}
        .tj .n{font-family:var(--serif);font-size:1.75rem;margin-top:.25rem;line-height:1.1}
        .tj .sub{font-size:.72rem;color:var(--text-light);margin-top:.15rem}

        /* ── Aviso de entregas de hoy ── */
        .hoy{background:var(--amber-bg);border:1px solid #EBD9AE;border-radius:14px;
             padding:.85rem 1.05rem;margin-bottom:1.5rem;font-size:.88rem;color:#6E5A1E}
        .hoy b{color:#4E3F12}

        h2{font-family:var(--serif);font-size:1.3rem;font-weight:500;margin:0 0 .9rem}

        /* ── Pedidos ── */
        .pedido{background:var(--white);border:1px solid var(--border);border-radius:16px;
                padding:1.05rem 1.15rem;margin-bottom:.8rem;box-shadow:var(--sombra)}
        .p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;
               flex-wrap:wrap;margin-bottom:.7rem}
        .p-prod{font-weight:600;font-size:.95rem}
        .p-fecha{font-size:.74rem;color:var(--text-light)}
        .p-monto{font-family:var(--serif);font-size:1.3rem;white-space:nowrap}
        .p-neto{font-size:.7rem;color:var(--text-light);text-align:right}

        .chip{display:inline-block;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
              padding:.16rem .55rem;border-radius:100px;font-weight:600;vertical-align:.1em}
        .ok{background:var(--green-bg);color:var(--green)}
        .pend{background:var(--amber-bg);color:var(--amber)}
        .no{background:#FBECEE;color:#B3454F}

        .datos{border-top:1px solid var(--border);padding-top:.7rem;
               display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:.5rem .9rem}
        .d{font-size:.83rem;line-height:1.5}
        .d span{color:var(--text-light);display:block;font-size:.7rem;
                letter-spacing:.08em;text-transform:uppercase}
        .d a{color:var(--accent-dark)}
        .dedic{grid-column:1/-1;background:var(--accent-light);border-radius:10px;
               padding:.5rem .75rem;font-style:italic;font-size:.85rem}

        .vacio{text-align:center;padding:3rem 1rem;color:var(--text-light);font-size:.9rem}
        .cargando{text-align:center;padding:2.5rem;color:var(--text-light);font-size:.88rem}
        .oculto{display:none}

        @media(max-width:520px){
            .tj .n{font-size:1.5rem}
            main{padding:1.1rem .9rem 3rem}
        }
    </style>
</head>
<body>

<!-- ══ ACCESO ══ -->
<div id="acceso" class="acceso">
    <svg viewBox="0 0 44 44" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M22 40 V24"/>
            <path d="M22 34 C15 34 11 30 11 25 C18 25 22 29 22 34 Z"/>
            <path d="M22 30 C29 30 33 26 33 21 C26 21 22 25 22 30 Z"/>
        </g>
        <g fill="currentColor">
            <ellipse cx="22" cy="10" rx="4.1" ry="5.6"/>
            <ellipse cx="29" cy="15" rx="4.1" ry="5.6" transform="rotate(72 29 15)"/>
            <ellipse cx="26" cy="23" rx="4.1" ry="5.6" transform="rotate(144 26 23)"/>
            <ellipse cx="18" cy="23" rx="4.1" ry="5.6" transform="rotate(216 18 23)"/>
            <ellipse cx="15" cy="15" rx="4.1" ry="5.6" transform="rotate(288 15 15)"/>
        </g>
        <circle cx="22" cy="16" r="3.4" fill="#C6A664"/>
    </svg>
    <h1>Panel</h1>
    <p>Botanica Studio</p>
    <form onsubmit="entrar(event)">
        <input type="password" id="clave" placeholder="Contraseña" autocomplete="current-password" required>
        <button class="btn" id="btnEntrar" type="submit">Entrar</button>
    </form>
    <p class="error oculto" id="errorAcceso"></p>
</div>

<!-- ══ PANEL ══ -->
<div id="panel" class="oculto">
    <div class="barra"><div class="barra-in">
        <div class="marca">
            <svg viewBox="0 0 44 44" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                    <path d="M22 40 V24"/>
                    <path d="M22 34 C15 34 11 30 11 25 C18 25 22 29 22 34 Z"/>
                </g>
                <g fill="currentColor">
                    <ellipse cx="22" cy="10" rx="4.1" ry="5.6"/>
                    <ellipse cx="29" cy="15" rx="4.1" ry="5.6" transform="rotate(72 29 15)"/>
                    <ellipse cx="26" cy="23" rx="4.1" ry="5.6" transform="rotate(144 26 23)"/>
                    <ellipse cx="18" cy="23" rx="4.1" ry="5.6" transform="rotate(216 18 23)"/>
                    <ellipse cx="15" cy="15" rx="4.1" ry="5.6" transform="rotate(288 15 15)"/>
                </g>
                <circle cx="22" cy="16" r="3.4" fill="#C6A664"/>
            </svg>
            Panel
        </div>
        <button class="salir" onclick="salir()">Salir</button>
    </div></div>

    <main>
        <div class="periodos" id="periodos">
            <button class="per" data-d="1">Hoy</button>
            <button class="per on" data-d="7">7 días</button>
            <button class="per" data-d="30">30 días</button>
            <button class="per" data-d="90">90 días</button>
        </div>

        <div id="avisoHoy"></div>
        <div class="tarjetas" id="tarjetas"></div>

        <h2>Pedidos</h2>
        <div id="lista"><div class="cargando">Cargando…</div></div>
    </main>
</div>

<script>
let CLAVE = '';
let DIAS = 7;

const $ = (id) => document.getElementById(id);
const money = (n) => '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

async function pedir(dias) {
    const r = await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clave: CLAVE, dias }),
    });
    if (r.status === 401) throw new Error('clave');
    if (!r.ok) throw new Error('servidor');
    return r.json();
}

async function entrar(e) {
    e.preventDefault();
    const btn = $('btnEntrar'), err = $('errorAcceso');
    btn.disabled = true; btn.textContent = 'Entrando…'; err.classList.add('oculto');
    CLAVE = $('clave').value;
    try {
        const data = await pedir(DIAS);
        // La clave sólo vive mientras la pestaña esté abierta.
        sessionStorage.setItem('bs_admin', CLAVE);
        $('acceso').classList.add('oculto');
        $('panel').classList.remove('oculto');
        pintar(data);
    } catch (ex) {
        err.textContent = ex.message === 'clave'
            ? 'Contraseña incorrecta.'
            : 'No se pudo conectar. Intenta de nuevo.';
        err.classList.remove('oculto');
        CLAVE = '';
    } finally {
        btn.disabled = false; btn.textContent = 'Entrar';
    }
}

function salir() {
    sessionStorage.removeItem('bs_admin');
    location.reload();
}

$('periodos').addEventListener('click', async (e) => {
    const b = e.target.closest('.per');
    if (!b) return;
    document.querySelectorAll('.per').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    DIAS = Number(b.dataset.d);
    $('lista').innerHTML = '<div class="cargando">Cargando…</div>';
    try { pintar(await pedir(DIAS)); }
    catch { $('lista').innerHTML = '<div class="vacio">No se pudieron cargar los pedidos.</div>'; }
});

function pintar(data) {
    const r = data.resumen;

    $('tarjetas').innerHTML = `
        <div class="tj"><div class="et">Pedidos</div><div class="n">${r.pedidos}</div>
             <div class="sub">últimos ${data.rango} días</div></div>
        <div class="tj"><div class="et">Vendido</div><div class="n">${money(r.ventas)}</div>
             <div class="sub">con envío incluido</div></div>
        <div class="tj"><div class="et">Te llegó</div><div class="n">${money(r.neto)}</div>
             <div class="sub">${money(r.comisiones)} de comisión</div></div>
        <div class="tj"><div class="et">Ticket promedio</div><div class="n">${money(r.ticket)}</div>
             <div class="sub">por pedido</div></div>`;

    $('avisoHoy').innerHTML = r.entregasHoy
        ? `<div class="hoy"><b>${r.entregasHoy} ${r.entregasHoy === 1 ? 'entrega' : 'entregas'} para hoy.</b>
           Revisa abajo las direcciones y horarios.</div>`
        : '';

    if (!data.pedidos.length) {
        $('lista').innerHTML = '<div class="vacio">Sin pedidos en este periodo.</div>';
        return;
    }

    $('lista').innerHTML = data.pedidos.map((p) => {
        const e = p.entrega, c = p.compra;
        const chip = p.estado === 'approved' ? '<span class="chip ok">Pagado</span>'
                   : p.estado === 'pending'  ? '<span class="chip pend">Pendiente</span>'
                   : `<span class="chip no">${p.estado}</span>`;
        const franjas = { '9-13': '9:00 a 13:00', '13-17': '13:00 a 17:00', '17-21': '17:00 a 21:00' };
        const prods = p.productos.map((i) => `${i.titulo} ×${i.cantidad}`).join(' · ') || '—';
        const fecha = new Date(p.fecha).toLocaleString('es-MX',
            { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'America/Mexico_City' });
        const mapa = e.mapa
            ? `https://maps.google.com/?q=${encodeURIComponent(e.mapa)}`
            : `https://maps.google.com/?q=${encodeURIComponent(e.direccion)}`;

        return `<div class="pedido">
            <div class="p-top">
                <div>
                    <div class="p-prod">${prods}</div>
                    <div class="p-fecha">${fecha} · ${chip}</div>
                </div>
                <div>
                    <div class="p-monto">${money(p.cobrado)}</div>
                    ${p.neto ? `<div class="p-neto">te llegan ${money(p.neto)}</div>` : ''}
                </div>
            </div>
            <div class="datos">
                <div class="d"><span>Recibe</span>${e.recibe || '—'}
                    ${e.tel ? ` · <a href="tel:${e.tel}">${e.tel}</a>` : ''}</div>
                <div class="d"><span>Entrega</span>${e.fecha || '—'}
                    ${franjas[e.franja] ? ` · ${franjas[e.franja]}` : ''}</div>
                <div class="d" style="grid-column:1/-1"><span>Dirección</span>
                    <a href="${mapa}" target="_blank" rel="noopener">${e.direccion || '—'}</a></div>
                ${e.referencias ? `<div class="d" style="grid-column:1/-1"><span>Referencias</span>${e.referencias}</div>` : ''}
                ${e.dedicatoria ? `<div class="dedic">“${e.dedicatoria}”</div>` : ''}
                <div class="d"><span>Compró</span>${c.nombre || '—'}
                    ${c.tel ? ` · <a href="tel:${c.tel}">${c.tel}</a>` : ''}</div>
                ${c.email ? `<div class="d"><span>Correo</span><a href="mailto:${c.email}">${c.email}</a></div>` : ''}
            </div>
        </div>`;
    }).join('');
}

// Si la pestaña ya tenía sesión, entra solo.
(function () {
    const guardada = sessionStorage.getItem('bs_admin');
    if (!guardada) return;
    CLAVE = guardada;
    pedir(DIAS).then((d) => {
        $('acceso').classList.add('oculto');
        $('panel').classList.remove('oculto');
        pintar(d);
    }).catch(() => sessionStorage.removeItem('bs_admin'));
})();
</script>
</body>
</html>
